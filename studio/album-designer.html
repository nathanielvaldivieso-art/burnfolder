<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="../shared/studio-pwa-viewport.js?v=20260815dnd1"></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>album page — burnfolder studio</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player" defer></script>
  <link rel="stylesheet" href="../style.css?v=20260815dnd1">
  <link rel="stylesheet" href="../shared/song-hub-redesign.css?v=20260907ui2">
  <link rel="stylesheet" href="css/studio.css?v=20260815dnd1">
</head>
<body class="studio-page studio-song-designer-page studio-album-designer-page">

  <main class="page-wrap studio-song-designer-layout">
    <div class="studio-song-designer-toolbar">
      <p class="page-id">album page</p>
      <div class="studio-song-designer-toolbar-actions">
        <a class="icon-btn" id="albumDesignerPreviewBtn" href="#">preview</a>
        <button type="button" class="icon-btn studio-song-push-btn" id="albumDesignerPushBtn">push to site</button>
      </div>
    </div>

    <div class="studio-song-designer-pick">
      <div class="studio-song-designer-pick-row">
        <label class="studio-song-designer-field">
          <span class="studio-song-designer-label">album</span>
          <select id="albumDesignerPick" class="studio-song-designer-select"></select>
        </label>
        <label class="studio-song-designer-field studio-song-designer-field--grow">
          <span class="studio-song-designer-label">title</span>
          <input
            type="text"
            id="albumDesignerTitle"
            class="studio-song-designer-input"
            placeholder="untitled"
            spellcheck="false"
            autocomplete="off"
            aria-label="Album title"
          >
        </label>
      </div>
      <p class="studio-song-designer-meta" id="albumDesignerMeta">—</p>
    </div>

    <div class="studio-song-designer-split">
      <section class="studio-song-designer-editor" aria-label="Album page editor">
        <section class="studio-song-designer-section">
          <h2 class="studio-song-designer-section-title">cover art</h2>
          <div class="studio-song-designer-cover-row">
            <button type="button" class="icon-btn" id="albumDesignerCoverBtn">choose cover</button>
            <button type="button" class="icon-btn" id="albumDesignerCoverClearBtn" hidden>remove</button>
            <input type="file" id="albumDesignerCoverInput" accept="image/*" hidden>
          </div>
          <img id="albumDesignerCoverPreview" class="studio-song-designer-cover-preview" alt="" hidden>
        </section>

        <section class="studio-song-designer-section">
          <h2 class="studio-song-designer-section-title">thoughts</h2>
          <p class="studio-song-designer-hint">Album-level notes shown on the album hub. Song lyrics and notes compile automatically from each song page.</p>
          <textarea id="albumDesignerNotes" class="studio-song-designer-textarea studio-song-designer-textarea--tall" rows="8" placeholder="thoughts about this album…" spellcheck="false"></textarea>
        </section>

        <section class="studio-song-designer-section">
          <h2 class="studio-song-designer-section-title">video</h2>
          <p class="studio-song-designer-hint">Optional hero video on the album hub.</p>
          <label class="studio-song-designer-field">
            <span class="studio-song-designer-label">from library</span>
            <select id="albumDesignerHeroVideo" class="studio-song-designer-select">
              <option value="">none</option>
            </select>
          </label>
        </section>

        <section class="studio-song-designer-section">
          <div class="studio-song-designer-section-head">
            <h2 class="studio-song-designer-section-title">visuals</h2>
            <div class="studio-song-designer-media-actions">
              <button type="button" class="icon-btn" id="albumDesignerPickVideoBtn">from library</button>
              <button type="button" class="icon-btn" id="albumDesignerAddImageBtn">+ image</button>
              <button type="button" class="icon-btn" id="albumDesignerAddNoteBtn">+ note</button>
              <button type="button" class="icon-btn" id="albumDesignerAddLinkBtn">+ link</button>
            </div>
          </div>
          <ul id="albumDesignerMediaList" class="studio-song-designer-media-list"></ul>
        </section>
      </section>

      <aside class="studio-song-designer-preview-wrap" aria-label="Album hub preview">
        <p class="studio-song-designer-preview-label">preview</p>
        <div class="studio-song-designer-preview song-hub-page" id="albumDesignerPreviewRoot">
          <div class="song-hub-header">
            <div class="song-hub-header-text">
              <h2 class="song-hub-title" data-album-field="title">Album</h2>
              <p class="song-hub-subtitle" data-album-field="subtitle">—</p>
              <p class="song-hub-meta" data-album-field="track-meta" hidden></p>
            </div>
          </div>
          <div class="song-hub-cover-row">
            <div data-album-panel="cover" class="song-hub-cover-wrap" hidden>
              <img data-album-field="cover" class="song-hub-cover-image" alt="">
            </div>
            <button type="button" class="bottom-play-pause-btn song-hub-play" hidden aria-label="Play album"></button>
          </div>
          <div data-album-panel="video" class="song-hub-panel" hidden>
            <div data-album-field="video-hero" class="song-hub-video-hero"></div>
          </div>
          <div data-album-panel="links" class="song-hub-panel" hidden>
            <nav class="album-hub-links" data-album-field="links" aria-label="Album links"></nav>
          </div>
          <div class="song-hub-panel">
            <div data-album-field="tracklist"></div>
          </div>
          <div data-album-panel="thoughts" class="song-hub-panel" hidden>
            <div class="song-hub-panel-top"><p class="song-hub-label">Thoughts</p></div>
            <div class="song-hub-notes" data-album-field="thoughts"></div>
          </div>
          <div data-album-panel="compiled-notes" class="song-hub-panel" hidden>
            <div class="song-hub-panel-top"><p class="song-hub-label">Notes</p></div>
            <div data-album-field="compiled-notes"></div>
          </div>
          <div data-album-panel="visuals" class="song-hub-panel" hidden>
            <div class="song-hub-panel-top"><p class="song-hub-label">Visuals</p></div>
            <div class="song-hub-content-grid" data-album-field="visuals-grid"></div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <p class="studio-stream-status studio-song-status" id="albumDesignerStatus" aria-live="polite"></p>

  <script src="js/studio-version.js?v=20260906play1"></script>
  <script src="js/studio-status.js?v=20260815dnd1"></script>
  <script src="../entries.js?v=20260815dnd1"></script>
  <script src="../songs.js?v=20260815dnd1"></script>
  <script src="../shared/song-versions.js?v=20260904key1"></script>
  <script src="js/asset-cloud.js?v=20260815dnd1"></script>
  <script src="../shared/cover-art.js?v=20260815dnd1"></script>
  <script src="../shared/mux-display-name.js?v=20260815dnd1"></script>
  <script src="js/mux-naming.js?v=20260815dnd1"></script>
  <script src="js/studio-site-menu.js?v=20260815dnd1"></script>
  <script src="js/studio-auth.js?v=20260815dnd1"></script>
  <script src="js/cloud-state.js?v=20260815dnd1"></script>
  <script src="js/mux-client.js?v=20260815dnd1"></script>
  <script src="js/studio-mux-lib.js?v=20260815dnd1"></script>
  <script src="../shared/song-page-render.js?v=20260815dnd1"></script>
  <script src="../shared/album-page-render.js?v=20260815dnd1"></script>
  <script src="js/cloud-store-kit.js?v=20260815dnd1"></script>
  <script src="js/song-page-store.js?v=20260815dnd1"></script>
  <script src="js/album-page-store.js?v=20260815dnd1"></script>
  <script src="js/stream-shared.js?v=20260818lock1"></script>
  <script src="js/album-designer-page.js?v=20260815dnd1"></script>
</body>
</html>
