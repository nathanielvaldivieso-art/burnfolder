<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="clips">
  <link rel="manifest" href="manifest.webmanifest">
  <title>clips — burnfolder studio</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://stream.mux.com" crossorigin>
  <link rel="preconnect" href="https://image.mux.com" crossorigin>

<body class="studio-page studio-clips-page">

  <main class="page-wrap studio-clips-layout" id="clipsRoot">
    <p class="page-id">clips</p>

    <input type="file" id="clipsFileInput" class="clips-file-input" multiple accept="*/*" hidden>
    <input type="file" id="clipsVideoInput" class="clips-file-input" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv" hidden>
    <input type="file" id="clipsFolderInput" class="clips-file-input" webkitdirectory directory mozdirectory multiple hidden>

    <div id="clipsVideoStageWrap" class="clips-video-stage-wrap" hidden>
      <div class="clips-video-stage-chrome">
        <p class="clips-video-stage-title" id="clipsVideoStageTitle">video</p>
        <button type="button" class="clips-video-stage-fullscreen" id="clipsVideoStageFullscreen" aria-label="Fullscreen">full</button>
        <button type="button" class="clips-video-stage-close" id="clipsVideoStageClose" aria-label="Close video">close</button>
      </div>
      <div id="clipsVideoStage" class="stream-video-stage clips-video-stage" aria-label="Video"></div>
    </div>
    <div id="clipsBoard" class="clips-board" aria-live="polite"></div>
    <div id="clipsUploadQueue" class="studio-upload-queue-host clips-upload-queue-host"></div>
    <p class="clips-status" id="clipsStatus" aria-live="polite"></p>
  </main>

  <div id="clipsLightbox" class="clips-lightbox" hidden>
    <button type="button" class="clips-lightbox-close" id="clipsLightboxClose" aria-label="Close">×</button>
    <img id="clipsLightboxImg" class="clips-lightbox-img" alt="">
  </div>
